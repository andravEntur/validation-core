syntax = "proto3";

package entur.validation.v1;

option java_package = "no.entur.validation.proto.v1";
option java_multiple_files = true;
option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  ERROR = 1;
  WARNING = 2;
  INFO = 3;
}

enum RuleType {
    RULE_TYPE_UNSPECIFIED = 0;
    STRUCTURAL = 1;
    INPUT = 2;
    CROSS = 3;
}
