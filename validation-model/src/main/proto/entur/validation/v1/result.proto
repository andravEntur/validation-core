syntax = "proto3";

package entur.validation.v1;
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/duration.proto";
import "entur/validation/v1/enum.proto";

option java_package = "no.entur.validation.proto.v1";
option java_multiple_files = true;
option go_package = "github.com/entur/validation-core/gen/entur/validation/v1;validationv1";



message Result{
 int64 rule_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = { example: { yaml: "\"1\"" } }
 ];

 int64 delivery_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = { example: { yaml: "\"1\"" } }
 ];

 google.protobuf.Timestamp start = 3 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = { example: { yaml: "\"2024-01-01T00:00:00Z\"" } }
 ];

 google.protobuf.Duration duration = 4 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = { example: { yaml: "\"100ms\"" } }
 ];

 repeated Message messages = 6 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = { example: { yaml: "[{\"message\": \"This is a message.\", \"files\": [\"file1.txt\", \"file2.txt\"]}]" } }
 ];

 bool success = 7 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = { example: { yaml: "\"true\"" } }
  ];

}

message Message{
  string message = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = { example: { yaml: "\"This is a message.\"" } }
  ];
  repeated string files = 2 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = { example: { yaml: "[\"file1.txt\", \"file2.txt\"]" } }
  ];

  Severity severity = 5 [
     (google.api.field_behavior) = REQUIRED,
     (gnostic.openapi.v3.property) = { example: { yaml: "\"ERROR\"" } }
  ];
}
