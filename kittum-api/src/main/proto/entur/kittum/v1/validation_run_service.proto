syntax = "proto3";

package entur.kittum.v1;

import "entur/http/v1/failure.proto";
import "entur/validation/v1/validation_data.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/entur/validation-core/gen/entur/kittum/v1;kittumv1";
option java_multiple_files = true;
option java_package = "no.entur.kittum.proto.v1";

// The gRPC service to request validation runs of specific validation rules.
service ValidationRunService {
  option (google.api.default_host) = "kittum.entur.io";

  // Dry-run validation rules against a dataset: requests a validation of `data` that runs only
  // the given rules, whether or not they are part of a validation flow, each at its default
  // severity. The result is not considered official. The validation runs asynchronously; this
  // returns as soon as it has been requested, with the correlation id its validation jobs carry.
  rpc DryRunValidationRules(DryRunValidationRulesRequest) returns (DryRunValidationRulesResponse) {
    option (google.api.http) = {
      post: "/validation/v1/rule-dry-runs"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {summary: "Dry-run validation rules against a dataset."};
    option (entur.http.v1.failure) = {
      code: "400"
      description: "No rules are given, or `data` has no location."
    };
    option (entur.http.v1.failure) = {
      code: "404"
      description: "No validation rule exists with one of the given ids."
    };
  }
}

// Request for DryRunValidationRules.
message DryRunValidationRulesRequest {
  // The database ids of the validation rules to run. At least one is required.
  repeated int32 rules = 1 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {min_items: 1}
  ];
  // The data to run the rules against. Its location is required.
  entur.validation.v1.ValidationData data = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response for DryRunValidationRules.
message DryRunValidationRulesResponse {
  // The correlation id of the requested validation, carried by every validation job made from it.
  string correlation_id = 1 [(gnostic.openapi.v3.property) = {
    example: {yaml: "\"0199a5c2-7b1e-7c3a-9f4e-2d6b8a1c3e5f\""}
  }];
}
